name: TEMP diagnostic (delete before merge)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          node -e "
          const UA = 'LivevivalBot/1.0 (https://livevival.vercel.app; contact: rigel@rawwy.ae)';
          (async () => {
            const portal = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Portal:Heroes&prop=text&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== PORTAL RENDERED (first 6000) ===');
            console.log(portal.slice(0, 6000));

            const wiki = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Chou&prop=wikitext&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== CHOU WIKITEXT (first 4000) ===');
            console.log(wiki.slice(0, 4000));

            const rendered = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Chou&prop=text&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== CHOU RENDERED INFOBOX AREA ===');
            const idx = rendered.indexOf('infobox');
            console.log(rendered.slice(Math.max(0, idx - 200), idx + 4000));
          })();
          "
