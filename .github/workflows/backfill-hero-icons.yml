name: Backfill hero icons (one-time)

# Manual-only, no schedule — this is a one-time cleanup for the ~80 heroes
# stuck without an icon because import-liquipedia-heroes.mjs's own first
# request (categorymembers) was hitting a sustained 429 and crashing
# before fetching anything (see scripts/backfill-hero-icons.mjs for the
# full root cause, confirmed via job logs). This script never calls
# categorymembers, so it isn't subject to that same failure. Safe to
# re-run; it only ever touches rows still missing an icon.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      # TEMP DIAGNOSTIC — remove before merge. Sandbox dev environments
      # can't reach liquipedia.net directly; this dumps real page structure
      # via a GH Actions runner (which has internet access) into job logs.
      - run: |
          node -e "
          const UA = 'LivevivalBot/1.0 (https://livevival.vercel.app; contact: rigel@rawwy.ae)';
          (async () => {
            const portal = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Portal:Heroes&prop=text&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== PORTAL RENDERED (first 8000) ===');
            console.log(portal.slice(0, 8000));

            const wiki = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Chou&prop=wikitext&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== CHOU WIKITEXT (first 5000) ===');
            console.log(wiki.slice(0, 5000));

            const rendered = await fetch('https://liquipedia.net/mobilelegends/api.php?action=parse&page=Chou&prop=text&format=json', { headers: { 'User-Agent': UA } }).then(r => r.text());
            console.log('=== CHOU RENDERED INFOBOX AREA ===');
            const idx = rendered.indexOf('infobox');
            console.log(rendered.slice(Math.max(0, idx - 200), idx + 5000));
          })();
          "
      - run: node scripts/backfill-hero-icons.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
