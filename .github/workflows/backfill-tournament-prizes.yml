name: Backfill tournament prize pools

# Originally one-time: re-scrapes the prizepool table for any tournament
# whose stored placement rows all have a null prize_usd (see
# scripts/backfill-tournament-prizes.mjs for the full root cause).
#
# Given a daily cron (part of the "keep team/hero/player data always up to
# date" pass): a tournament's prize pool is often only confirmed/published
# on Liquipedia after it concludes, so newly-finished tournaments keep
# needing this same backfill on an ongoing basis, not just once. Safe to
# re-run; only ever touches tournaments still missing prize data.
on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backfill-tournament-prizes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/backfill-tournament-prizes.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
