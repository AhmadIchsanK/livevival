name: Import Liquipedia rosters and finished-match details

# Split out from liquipedia-import.yml and offset by 3 hours so it gets its
# own fresh rate-limit window instead of running back-to-back with the
# matches import — a full matches pass alone can consume ~30 minutes of
# request budget and leave Liquipedia's short-term throttle still active
# for whatever runs next in the same job.
#
# THESE USED TO BE TWO STEPS IN ONE JOB. That was the bug: import-team-
# details.mjs's own header comment documents a cold run across ~300 teams
# taking up to "~6h05m" — as the first step in a single sequential job,
# it could (and in production did — observed stuck "in_progress" for
# hours, never reaching the second step) consume the entire job runtime,
# meaning refresh-finished-match-details.mjs — the actually time-critical
# script that fixes finished-match scores/picks/VODs — silently never got
# to run at all, cycle after cycle. Split into two independent jobs with
# their own timeouts and concurrency groups so a slow roster pass can
# never starve the match-details refresh (or vice versa) again.
on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      tournament_slugs:
        description: >-
          Optional: comma-separated liquipedia_slug value(s) (e.g.
          "MPL/Indonesia/Season_17,MPL/Indonesia/Season_16") to refresh
          finished-match details (games/picks/bans/VODs) for those
          tournaments only, bypassing the past-year window and table order —
          for tournaments that keep missing the normal pass's timeout/
          cancellation because of where they sit in the list. Leave blank for
          the normal full pass. Only applies to the refresh-match-details
          job; import-team-rosters always runs its normal full pass.
        required: false
        default: ""

jobs:
  refresh-match-details:
    runs-on: ubuntu-latest
    # Originally capped at 60 min on the assumption ~150 tournaments x a
    # handful of paced requests each would comfortably fit under an hour.
    # Wrong: run 30758529923 was still working through the tournament list
    # when GitHub force-cancelled it at exactly 60 min (271 of 733 games
    # still had <2 teams' picks recorded at cancellation, down from 731 at
    # the start of that same run — real progress, just not enough runway).
    # The script has no resume/skip-state — every trigger restarts from
    # tournament #1 in table order, so a too-short cap keeps cutting off at
    # the same point instead of ever reaching the tail of the list. Raised
    # to match the roster job's ceiling so a single run can actually finish.
    timeout-minutes: 180
    concurrency:
      group: liquipedia-refresh-match-details
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/refresh-finished-match-details.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOURNAMENT_SLUGS: ${{ github.event.inputs.tournament_slugs }}

  import-team-rosters:
    runs-on: ubuntu-latest
    # Genuinely can take hours on a cold run (see script header) — capped
    # so a slow/rate-limited run can't run past the next scheduled trigger
    # and queue up behind itself. Already-complete teams are skipped on
    # each run, so a capped run just picks up more next cycle.
    timeout-minutes: 180
    concurrency:
      group: liquipedia-import-team-rosters
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/import-team-details.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
