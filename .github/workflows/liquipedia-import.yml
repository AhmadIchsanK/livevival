name: Import Liquipedia tournaments

# Core schedule/score data — tournaments, heroes, matches.
#
# THESE USED TO BE THREE STEPS IN ONE JOB — the same anti-pattern fixed in
# liquipedia-import-details.yml, found here independently: this run sat
# "in_progress" for 4+ hours on an old commit, never reaching
# import-liquipedia-matches.mjs (step 3), which is why tournaments this
# scraper already knows about (e.g. MPL Indonesia Season 18) showed zero
# scheduled matches even though Liquipedia's own bracket page already had
# a full published schedule — the step that would have imported it never
# got a turn. Split into independent jobs so a slow step can never again
# starve the ones after it. import-matches still needs tournaments to
# exist first (it reads the tournaments table rather than discovering
# pages itself), so it depends on import-tournaments; heroes has no such
# dependency and runs in parallel.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tournament_slugs:
        description: >-
          Optional: comma-separated liquipedia_slug value(s) (e.g.
          "MPL/Indonesia/Season_18,MPL/Malaysia/Season_18") to re-import
          matches for those tournaments only, bypassing the past-year
          window and table order — for a tournament that keeps missing the
          normal pass's timeout because of where it sits in the list. Leave
          blank for the normal full pass.
        required: false
        default: ""

jobs:
  # TEMPORARY diagnostic job #2 — investigating a bug where deriveStage-
  # FromBracket assigned "Round of 16" to every playoff match including the
  # confirmed Grand Final. Removed once fixed.
  diagnose-bracket2:
    if: github.event.inputs.tournament_slugs == 'Games_of_the_Future/2026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install cheerio
      - run: node scripts/_diagnose-bracket-markup2.mjs "Games_of_the_Future/2026"

  import-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: liquipedia-import-tournaments
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/import-liquipedia.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  import-heroes:
    runs-on: ubuntu-latest
    # Was capped at 30 min on the assumption ~130 heroes x a paced request
    # each would fit comfortably. Wrong: confirmed via job logs the run
    # hits this cap and gets force-cancelled mid-alphabet every time (~80
    # heroes needing an icon fetch x ~4-8s each, plus a full categorymembers
    # pass first) — hero icons were stuck at exactly Harley→Zilong across
    # every re-trigger as a result. Raised to give a cold/mostly-cold run
    # enough runway to actually finish in one pass. The script now also
    # backfills role/lane/region per hero (one extra infobox fetch, only
    # while any of those three are still null) — worst case doubles the
    # request count on the very first cold run after this changed, still
    # comfortably inside this budget; every run after that only re-fetches
    # for genuinely new heroes.
    #
    # 90 min still wasn't enough (confirmed via run 30967015229, cancelled
    # at exactly 90:00): the "only re-fetch for new heroes" assumption above
    # didn't hold — 132 of 133 heroes still needed an icon upgrade and/or
    # metadata fetch every run, and once Liquipedia's rate limiter engaged a
    # sustained block partway through, the script's default 6-retry/~7-min
    # budget just burned the rest of the timeout retry-looping on a handful
    # of heroes without saving any of them. Fixed in the script itself (see
    # import-liquipedia-heroes.mjs's header comment): a much smaller
    # per-call retry budget so a throttled hero fails fast instead of
    # eating minutes, and a hard per-run cap on how many heroes get fetched
    # so a run can never again gamble this whole timeout on finishing the
    # backlog in one pass. Left at 90 as comfortable headroom over the
    # script's own new worst-case (~65 min), not because it needs raising
    # further.
    timeout-minutes: 90
    concurrency:
      group: liquipedia-import-heroes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/import-liquipedia-heroes.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  import-matches:
    needs: import-tournaments
    runs-on: ubuntu-latest
    # Raised from 45: import-liquipedia-matches.mjs now makes one extra
    # subpage-discovery request per tournament (plus a fetch per subpage
    # actually found — e.g. "Regular_Season") instead of just one request
    # for the tournament's own page, since many tournaments' real matches
    # live entirely on a subpage rather than the tournament's own page (see
    # that script's header comment for how this was confirmed). No
    # resume/skip-state exists here — a cap that's too tight cuts off at the
    # same point in table order every run instead of ever reaching the tail
    # of the tournament list, same failure mode already fixed for
    # import-heroes and the roster job above/in liquipedia-import-details.yml.
    timeout-minutes: 75
    concurrency:
      group: liquipedia-import-matches
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/import-liquipedia-matches.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOURNAMENT_SLUGS: ${{ github.event.inputs.tournament_slugs }}
