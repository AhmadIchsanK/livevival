name: Import Liquipedia tournaments

# Core schedule/score data — tournaments, heroes, matches. Kept in its own
# run (separate from liquipedia-import-details.yml) so the two don't
# compete for the same rate-limit budget: a full matches pass across every
# active tournament alone can take ~30 minutes and consume Liquipedia's
# short-term throttle window, which previously starved the very next step
# (team-rosters) in the same job. continue-on-error on each step means one
# rate-limited tournament doesn't block the rest of the run.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Same reasoning as liquipedia-import-details.yml: prevent an overlapping
# dispatch/schedule pair from hitting Liquipedia concurrently and doubling
# the 429 rate for both.
concurrency:
  group: liquipedia-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/import-liquipedia.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: node scripts/import-liquipedia-heroes.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: node scripts/import-liquipedia-matches.mjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
