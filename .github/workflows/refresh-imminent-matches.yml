name: Refresh imminent match streams

# Lightweight, frequent job — only re-checks tournaments with a match
# starting soon or in progress, so it's safe to run often without
# hammering Liquipedia's API the way the full import would.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js cheerio
      - run: node scripts/debug-stream-selector.mjs
