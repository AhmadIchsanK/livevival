<!-- Finished match: Team Alpha beats Team Beta 2-0, with picks/bans and VOD links.
     Row/label/icon shape below is copied from a real Liquipedia bracket page
     the owner pasted in directly (not a hand-built guess) — one
     .brkts-popup-body-grid-row is a whole game (both sides), not half of one. -->
<div class="brkts-popup-container brkts-match-info-popup">
  <div class="match-info-header">
    <div class="match-info-header-opponent match-info-header-opponent-left match-info-header-winner">
      <span class="name hidden-xs">Team Alpha</span>
    </div>
    <div class="match-info-header-opponent">
      <span class="name hidden-xs">Team Beta</span>
    </div>
    <div class="timer-object" data-timestamp="1700000000" data-finished="finished"></div>
  </div>

  <div class="brkts-popup-body">
    <!-- Game 1: left (Alpha) wins -->
    <div class="brkts-popup-body-grid-row">
      <div class="generic-label" data-label-type="result-win"></div>
      <div class="brkts-popup-body-grid-row-detail">
        <div class="brkts-popup-spaced">
          <div class="brkts-popup-body-element-thumbs brkts-champion-icon">
            <a title="Hero One"></a>
            <a title="Hero Two"></a>
          </div>
        </div>
        <div class="brkts-popup-spaced">17:08</div>
        <div class="brkts-popup-spaced">
          <div class="brkts-popup-body-element-thumbs brkts-champion-icon brkts-popup-body-element-thumbs-right">
            <a title="Hero Three"></a>
            <a title="Hero Four"></a>
          </div>
        </div>
      </div>
      <div class="generic-label" data-label-type="result-loss"></div>
      <div class="brkts-popup-comment"><b>Dangerous Grass</b></div>
    </div>

    <!-- Game 2: right (Beta) wins -->
    <div class="brkts-popup-body-grid-row">
      <div class="generic-label" data-label-type="result-loss"></div>
      <div class="brkts-popup-body-grid-row-detail">
        <div class="brkts-popup-spaced">
          <div class="brkts-popup-body-element-thumbs brkts-champion-icon">
            <a title="Hero Five"></a>
            <a title="Hero Six"></a>
          </div>
        </div>
        <div class="brkts-popup-spaced">21:45</div>
        <div class="brkts-popup-spaced">
          <div class="brkts-popup-body-element-thumbs brkts-champion-icon brkts-popup-body-element-thumbs-right">
            <a title="Hero Seven"></a>
            <a title="Hero Eight"></a>
          </div>
        </div>
      </div>
      <div class="generic-label" data-label-type="result-win"></div>
      <div class="brkts-popup-comment"><b>Expanding Rivers</b></div>
    </div>
  </div>

  <div class="brkts-popup-veto-wrapper">
    <div class="brkts-popup-veto-row">
      <div class="brkts-champion-icon">
        <a title="Ban Left One"></a>
      </div>
      <div class="brkts-champion-icon brkts-popup-body-element-thumbs-right">
        <a title="Ban Right One"></a>
      </div>
    </div>
    <div class="brkts-popup-veto-row">
      <div class="brkts-champion-icon">
        <a title="Ban Left Two"></a>
      </div>
      <div class="brkts-champion-icon brkts-popup-body-element-thumbs-right">
        <a title="Ban Right Two"></a>
      </div>
    </div>
  </div>

  <div class="brkts-popup-footer">
    <span class="plainlinks vodlink" title="Watch Game 1">
      <a href="https://youtube.com/watch?v=game1"></a>
    </span>
    <span class="plainlinks vodlink" title="Watch Game 2">
      <a href="https://youtube.com/watch?v=game2"></a>
    </span>
  </div>
</div>
